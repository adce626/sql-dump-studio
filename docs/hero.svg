<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SQL Dump Studio — explore, query and export SQL dumps entirely in your browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.5" stop-color="#101a30"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="62"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; fill: #f1f5f9; }
    .sub { font-size: 22px; font-weight: 500; fill: #94a3b8; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.14em; fill: #64748b; }
    .kw { fill: #c084fc; }
    .fn { fill: #22d3ee; }
    .st { fill: #34d399; }
    .cm { fill: #64748b; }

    .drift { animation: drift 22s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-44px); } }

    .bob { animation: bob 7s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

    .bob2 { animation: bob2 9s ease-in-out infinite; }
    @keyframes bob2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    .blink { animation: blink 1.05s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }

    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }

    .type { opacity: 0; }
  </style>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g class="drift">
    <rect x="-44" y="-44" width="1300" height="520" fill="url(#grid)"/>
  </g>

  <!-- ambient glow -->
  <circle cx="150" cy="90" r="90" fill="#8b5cf6" opacity="0.5" filter="url(#soft)" class="pulse"/>
  <circle cx="1080" cy="330" r="105" fill="#22d3ee" opacity="0.4" filter="url(#soft)" class="pulse" style="animation-delay: 1.1s"/>
  <circle cx="760" cy="30" r="70" fill="#34d399" opacity="0.35" filter="url(#soft)" class="pulse" style="animation-delay: 0.6s"/>

  <!-- floating code tokens -->
  <g class="mono bob" opacity="0.72">
    <rect x="70" y="250" width="118" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <text x="88" y="273" class="mono" font-size="15" fill="#c4b5fd">JOIN</text>
  </g>
  <g class="mono bob2" opacity="0.72" style="animation-delay: 1.4s">
    <rect x="1010" y="120" width="150" height="34" rx="8" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="1028" y="143" class="mono" font-size="15" fill="#67e8f9">CSV · XLSX</text>
  </g>
  <g class="mono bob" opacity="0.66" style="animation-delay: 2.2s">
    <rect x="930" y="250" width="132" height="34" rx="8" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="948" y="273" class="mono" font-size="15" fill="#6ee7b7">PRIMARY KEY</text>
  </g>

  <!-- headline -->
  <text x="600" y="150" text-anchor="middle" class="sans title">
    <tspan>SQL </tspan><tspan fill="#38bdf8">Dump</tspan><tspan> Studio</tspan>
  </text>
  <text x="600" y="196" text-anchor="middle" class="sans sub">
    Open any .sql dump — explore, query and export it entirely in your browser.
  </text>

  <!-- animated typing line -->
  <g class="mono" font-size="19" text-anchor="middle">
    <text x="600" y="258" class="mono">
      <tspan class="type"><tspan class="kw">SELECT</tspan><tspan class="cm"> * </tspan><tspan class="kw">FROM</tspan><tspan class="cm"> </tspan><tspan class="fn">customers</tspan><tspan class="cm">;</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      </tspan>
    </text>
    <text x="788" y="258" class="mono blink" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite" begin="1.2s"/>
      <rect x="-9" y="-16" width="10" height="19" rx="2" fill="#22d3ee"/>
    </text>
  </g>

  <!-- result chips -->
  <g class="sans" text-anchor="middle">
    <text x="600" y="320" class="sans chip shine">NO SERVER · NO UPLOAD · MIT</text>
  </g>

  <!-- bottom rule -->
  <rect x="120" y="352" width="960" height="2" rx="1" fill="url(#rule)" opacity="0.85"/>
  <circle cx="120" cy="353" r="4" fill="#8b5cf6" class="pulse" filter="url(#glow)"/>
  <circle cx="1080" cy="353" r="4" fill="#34d399" class="pulse" style="animation-delay: 0.8s" filter="url(#glow)"/>
</svg>
